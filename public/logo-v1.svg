<?xml version="1.0" encoding="UTF-8"?>
<!-- V1: Cat Eye Mark + Wordmark (Recommended) -->
<svg width="240" height="60" viewBox="0 0 240 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="eyeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="textGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8d5ff"/>
    </linearGradient>
    <filter id="eyeGlow1" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cat ear tufts -->
  <polygon points="5,28 11,7 21,23" fill="#c026d3"/>
  <polygon points="44,28 38,7 28,23" fill="#c026d3"/>
  <!-- Ear inner highlight -->
  <polygon points="8,26 12,12 18,22" fill="#e879f9" opacity="0.6"/>
  <polygon points="41,26 37,12 31,22" fill="#e879f9" opacity="0.6"/>

  <!-- Glow halo behind eye -->
  <path d="M1,31 Q24.5,7 48,31 Q24.5,55 1,31 Z"
        fill="#7c3aed" opacity="0.3" filter="url(#eyeGlow1)"/>

  <!-- Eye outer almond shape -->
  <path d="M3,31 Q24.5,11 46,31 Q24.5,51 3,31 Z"
        fill="url(#eyeGrad1)" filter="url(#softGlow1)"/>

  <!-- Iris inner ring -->
  <ellipse cx="24.5" cy="31" rx="10" ry="14" fill="#5b21b6" opacity="0.5"/>

  <!-- Pupil slit (vertical cat pupil) -->
  <ellipse cx="24.5" cy="31" rx="4.5" ry="13" fill="#0f0b1e"/>

  <!-- Iris shine highlights -->
  <circle cx="29" cy="23" r="3.5" fill="white" opacity="0.75"/>
  <circle cx="20" cy="38" r="1.8" fill="white" opacity="0.3"/>

  <!-- CATZYE wordmark -->
  <text x="62" y="43"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="29"
        fill="url(#textGrad1)"
        letter-spacing="2">CATZYE</text>

  <!-- Subtle dot accent -->
  <circle cx="232" cy="31" r="3" fill="#e879f9" opacity="0.7"/>
</svg>
