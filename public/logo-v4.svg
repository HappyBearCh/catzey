<?xml version="1.0" encoding="UTF-8"?>
<!-- V4: Manga Speed Lines + Bold Wordmark -->
<svg width="280" height="60" viewBox="0 0 280 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="30%" stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="textGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f0e6ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <filter id="textDrop" x="-2%" y="-10%" width="104%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#7c3aed" flood-opacity="0.8"/>
    </filter>
    <filter id="markGlow4" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="textClip">
      <rect x="0" y="0" width="280" height="60"/>
    </clipPath>
  </defs>

  <!-- Manga speed lines background -->
  <line x1="0" y1="30" x2="280" y2="6"  stroke="#7c3aed" stroke-width="0.5" opacity="0.15"/>
  <line x1="0" y1="30" x2="280" y2="12" stroke="#7c3aed" stroke-width="0.5" opacity="0.12"/>
  <line x1="0" y1="30" x2="280" y2="18" stroke="#7c3aed" stroke-width="0.5" opacity="0.10"/>
  <line x1="0" y1="30" x2="280" y2="24" stroke="#7c3aed" stroke-width="0.5" opacity="0.08"/>
  <line x1="0" y1="30" x2="280" y2="30" stroke="#7c3aed" stroke-width="0.5" opacity="0.07"/>
  <line x1="0" y1="30" x2="280" y2="36" stroke="#7c3aed" stroke-width="0.5" opacity="0.08"/>
  <line x1="0" y1="30" x2="280" y2="42" stroke="#7c3aed" stroke-width="0.5" opacity="0.10"/>
  <line x1="0" y1="30" x2="280" y2="48" stroke="#7c3aed" stroke-width="0.5" opacity="0.12"/>
  <line x1="0" y1="30" x2="280" y2="54" stroke="#7c3aed" stroke-width="0.5" opacity="0.15"/>

  <!-- Cat eye mark (compact, on left) -->
  <path d="M2,30 Q18,16 34,30 Q18,44 2,30 Z"
        fill="#7c3aed" opacity="0.4" filter="url(#markGlow4)"/>
  <path d="M4,30 Q18,18 32,30 Q18,42 4,30 Z" fill="#9333ea"/>
  <ellipse cx="18" cy="30" rx="3.5" ry="10" fill="#0f0b1e"/>
  <circle cx="21" cy="24" r="2.5" fill="white" opacity="0.8"/>

  <!-- Bottom accent bar (manga panel style) -->
  <rect x="0" y="52" width="280" height="3" fill="url(#accentBar)" rx="1.5"/>

  <!-- CATZYE bold text with drop shadow -->
  <text x="44" y="45"
        font-family="'Arial Black', Impact, 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="34"
        fill="url(#textGrad4)"
        letter-spacing="4"
        filter="url(#textDrop)">CATZYE</text>

  <!-- Star/sparkle accents -->
  <g fill="#e879f9" opacity="0.7">
    <path d="M262,10 L263.5,14 L267,15 L263.5,16 L262,20 L260.5,16 L257,15 L260.5,14 Z"/>
    <circle cx="272" cy="22" r="1.5"/>
    <circle cx="258" cy="8" r="1"/>
  </g>
</svg>
